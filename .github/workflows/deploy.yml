name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to cPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script: |
            if [ ! -d "/home/andofoodvn/repositories/andong-food-website" ]; then
              mkdir -p /home/andofoodvn/repositories
              git clone https://github.com/VMinhThuan/andong-food-website.git /home/andofoodvn/repositories/andong-food-website
            else
              cd /home/andofoodvn/repositories/andong-food-website
              git pull origin main
            fi
            cd /home/andofoodvn/repositories/andong-food-website/backend
            npm install --production
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deployment completed successfully!"
