name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '45.119.80.8' }}
          username: ${{ secrets.FTP_USERNAME || 'andofoodvn' }}
          password: ${{ secrets.FTP_PASSWORD || '7T)Vdn2TV0Sv' }}
          port: 21
          server-dir: repositories/andong-food-website/
          protocol: ftp

      - name: Create restart trigger for Node.js App
        run: echo "Restarting Node.js App..."
